<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmoToy - Live Inference</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="rf_model.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow"><a href="index.html" style="color:inherit;text-decoration:none;">&larr; Back to Home</a></p>
      <h1>Live Inference</h1>
      <p class="subtitle">Real-time embedded Random Forest classification.</p>
    </div>
    <div class="status-card" id="connectionStatus">
      <span class="status-dot offline"></span>
      <div>
        <strong>Disconnected</strong>
        <small>No BLE device selected</small>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel config-panel">
      <div class="panel-head">
        <h2>1. BLE Connection</h2>
      </div>
      <div class="button-row" style="margin-top: 1rem;">
        <button class="primary" id="connectBtn">Connect BLE Device</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
      </div>
    </section>

    <section class="panel inference-panel wide">
      <div class="panel-head">
        <h2>2. Real-Time Status</h2>
      </div>
      <div class="inference-grid" style="margin-top: 1rem;">
         <div class="metric inference-main">
            <small>Current Prediction</small>
            <strong id="currentPrediction">--</strong>
         </div>
         <div class="metric">
            <small>Last Prediction</small>
            <strong id="lastPrediction">--</strong>
         </div>
         <div class="metric">
            <small>Incoming Data Rate</small>
            <strong id="dataRate">0 Hz</strong>
         </div>
      </div>
      
      <div class="last-packet" style="margin-top: 2rem;">
        <small>Last Packet Received</small>
        <pre id="lastPacket">Waiting for BLE data...</pre>
      </div>
    </section>
  </main>
  
  <script src="inference.js"></script>
</body>
</html>
